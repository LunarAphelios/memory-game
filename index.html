<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./app.js" defer></script>
</head>
<body>
    <h1>Memory Game</h1>
    <button id="start">Start</button>
    <button id="again" disabled>Play Again</button>
    <br />

    <div class="cards">
        <div class="card">
            <button class="btn" >

            </button>

            <img src="./assets/card-back.jpg" alt="card back" id="1"  class="game-card time-up" width="200">
            </button>

            </button>

        </div>
        <div class="card">

            <button class="btn" >
            <img src="./assets/card-back.jpg" alt="card back" id="5"  class="game-card time-up" width="200">
